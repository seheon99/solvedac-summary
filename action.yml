name: Baekjoon profile summary

description: Keep solved.ac cards for your profile in README.md

inputs:
  username:
    description: "solved.ac 핸들"
    required: true
  color:
    description: "카드 테마: light 또는 dark"
    required: false
    default: "light"

runs:
  using: "composite"
  steps:
    - name: Generate solved.ac summary
      run: |
        if ! [[ "$HANDLE" =~ ^[A-Za-z0-9_]{1,64}$ ]]; then
          echo "Error: username must match [A-Za-z0-9_]{1,64}, got '$HANDLE'" >&2
          exit 1
        fi
        if [[ "$COLOR" != light && "$COLOR" != dark ]]; then
          echo "Error: color must be light or dark, got '$COLOR'" >&2
          exit 1
        fi
        card() { echo "https://solvedac-cards.seheon.kr/$1/$HANDLE?color=$COLOR"; }
        cat > README.tmp <<EOF
        [![solved.ac Profile]($(card profile))](https://solved.ac/$HANDLE)

        ![Summary]($(card summary))

        ## 레이팅 변화

        ![Rating]($(card rating))

        ## 스트릭

        ![Streak]($(card streak))

        ## 태그별 통계

        ![Tags]($(card tags))

        ## 난이도 분포

        ![Problems]($(card problems))
        EOF
      shell: bash
      env:
        HANDLE: ${{ inputs.username }}
        COLOR: ${{ inputs.color }}

    - name: Ensure AUTO-UPDATE section exists
      run: |
        if ! grep -q "<!-- START AUTO-UPDATE -->" README.md; then
          echo -e "\n<!-- START AUTO-UPDATE -->\n<!-- END AUTO-UPDATE -->" >> README.md
        elif ! grep -q "<!-- END AUTO-UPDATE -->" README.md; then
          sed -i 's/<!-- START AUTO-UPDATE -->/<!-- START AUTO-UPDATE -->\n<!-- END AUTO-UPDATE -->/' README.md
        fi
      shell: bash

    - name: Update README.md
      run: |
        sed -i '/<!-- START AUTO-UPDATE -->/,/<!-- END AUTO-UPDATE -->/{
          /<!-- START AUTO-UPDATE -->/ {
          p
          r README.tmp
          }
          /<!-- END AUTO-UPDATE -->/ p
          d
        }' README.md
      shell: bash

    - name: Commit and push README.md
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add README.md
        if git diff --cached --quiet; then
          echo "README.md is unchanged; nothing to push."
          exit 0
        fi
        git commit -m "Refresh README.md"
        # The branch can move while this runs (another run, a push). Replay the
        # refresh on top and retry; on a conflict the freshly generated README wins
        # (-X theirs is this commit during a rebase).
        for attempt in 1 2 3; do
          git push && exit 0
          echo "Push rejected (attempt $attempt); rebasing onto the latest branch."
          git pull --rebase -X theirs || { git rebase --abort; exit 1; }
          sleep $((attempt * 2))
        done
        echo "Error: could not push README.md after 3 attempts." >&2
        exit 1
      shell: bash

branding:
  icon: "edit"
  color: "yellow"
